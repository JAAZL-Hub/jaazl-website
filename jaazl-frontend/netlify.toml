[build]
  command = "next build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Handle form submissions
[build.environment]
  NEXT_PUBLIC_SITE_URL = "https://jaazl.com"
  NODE_VERSION = "22.0.0"

# Form notifications settings
[forms]
  [forms.contact]
    name = "Contact Form"
    [forms.contact.email_notification]
      to = "aalmodhayan@jaazl.com"
      subject = "New contact form submission from JAAZL website"

# Redirect for form success
[[redirects]]
  from = "/thank-you"
  to = "/thank-you"
  status = 200
