[build]
  command = "npm ci && npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Handle form submissions
[build.environment]
  NEXT_PUBLIC_SITE_URL = "https://jaazl.com"
  NODE_VERSION = "20.18.0"
  NPM_FLAGS = "--legacy-peer-deps"
  NETLIFY = "true"

# Form notifications settings
[forms]
  [forms.contact]
    name = "Contact Form"
    [forms.contact.email_notification]
      to = "aalmodhayan@jaazl.com"
      subject = "New contact form submission from JAAZL website"

# Performance and Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Cache static assets for better performance
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/Fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Preload critical resources for homepage
[[headers]]
  for = "/"
  [headers.values]
    Link = '''</Fonts/manifa-pro-2-bold.otf>; rel=preload; as=font; type=font/otf; crossorigin,
              </Fonts/Manifa-Pro-2-Light.otf>; rel=preload; as=font; type=font/otf; crossorigin,
              </images/JAAZL-Logo 2.png>; rel=preload; as=image'''

# Redirects
[[redirects]]
  from = "/home"
  to = "/"
  status = 301

[[redirects]]
  from = "/thank-you"
  to = "/thank-you"
  status = 200
